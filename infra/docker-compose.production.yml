# Продакшен: образы берутся с Docker Hub (их собирает GitHub Actions).
# На сервере: DOCKERHUB_USERNAME=<логин> docker compose -f docker-compose.production.yml up -d
volumes:
  pg_data:
  static:
  media:
  frontend_static:

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/foodgram_backend:latest
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/foodgram_frontend:latest
    volumes:
      - frontend_static:/frontend_static

  nginx:
    image: ${DOCKERHUB_USERNAME}/foodgram_gateway:latest
    ports:
      - "8000:80"
    volumes:
      - frontend_static:/usr/share/nginx/html
      - static:/backend_static
      - media:/media
    depends_on:
      - backend
      - frontend
    restart: always
